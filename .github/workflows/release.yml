name: Full Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Package and test full Windows distribution
        shell: pwsh
        run: ./scripts/Package-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AutoScript-win-x64-full
          path: |
            artifacts/AutoScript-win-x64-full.zip
            artifacts/AutoScript-win-x64-full.zip.sha256
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" artifacts/AutoScript-win-x64-full.zip artifacts/AutoScript-win-x64-full.zip.sha256 --verify-tag --title "AutoScript $env:GITHUB_REF_NAME — Windows x64 đầy đủ" --notes "Giải nén toàn bộ ZIP và mở AutoScript.exe. Đã kèm .NET Desktop Runtime và Python, không cần cài riêng. Thêm bộ thu thập transcript kênh YouTube bằng Python (vidIQ MCP hoặc Supadata native), hàng đợi viết lại tuần tự và văn phong mặc định. Cần cấu hình YouTube Data API key và key nguồn transcript một lần. Nhấn Bắt đầu để tự viết và xuất TXT. Cần Internet và Gemini API key có quota. Adapter transcript được kiểm thử giả lập, chưa xác minh tài khoản/endpoint vidIQ thật do mạng môi trường phát triển chặn truy cập. Gói được kiểm tra Python, luồng viết lại bằng API giả lập và khởi động cửa sổ WPF trên Windows."
